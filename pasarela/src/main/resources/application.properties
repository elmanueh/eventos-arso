# Configuración de la aplicación
spring.application.name=pasarela
server.servlet.context-path=/api
server.port=8080

zuul.sensitiveHeaders=

zuul.routes.espaciosfisicos.path = /espaciosfisicos/**
zuul.routes.espaciosfisicos.url = ${ESPACIOS_URL}/espaciosfisicos

zuul.routes.eventos.path = /eventos/**
zuul.routes.eventos.url = ${EVENTOS_URL}/eventos

zuul.routes.reservas.path = /reservas/**
zuul.routes.reservas.url = ${RESERVAS_URL}/reservas

spring.security.oauth2.client.registration.github.clientId=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.clientSecret=${GITHUB_CLIENT_SECRET}