# Configuración de la aplicación
spring.application.name=gateway
server.servlet.context-path=/api
server.port=8080

zuul.sensitiveHeaders=

zuul.routes.espaciosfisicos.path = /espaciosfisicos/**
zuul.routes.espaciosfisicos.url = http://localhost:8081/api/espaciosfisicos

zuul.routes.eventos.path = /eventos/**
zuul.routes.eventos.url = http://localhost:8082/api/eventos

zuul.routes.reservas.path = /reservas/**
zuul.routes.reservas.url = http://localhost:8083/api/reservas